name: Release

on:
  push:
    tags:
      - "v*"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$TAG'. Expected vMAJOR.MINOR.PATCH"
            exit 1
          fi

  build:
    name: Build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    needs: [ "validate-tag", "lint" ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: Quality gate
        run: make tidy vet test

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          go build -ldflags "-X noto/internal/version.Version=${GITHUB_REF_NAME} -X noto/internal/version.Commit=${GITHUB_SHA} -X noto/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/noto-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/noto

      - name: Package artifact
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip noto-${{ matrix.goos }}-${{ matrix.goarch }}.zip noto-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          else
            tar -czf noto-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz noto-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: noto-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.zip dist/*.tar.gz

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: ${GITHUB_REF_NAME}
          tag_name: ${GITHUB_REF_NAME}
          generate_release_notes: true
          files: release-assets/*
