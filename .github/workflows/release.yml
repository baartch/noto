name: Release

on:
  push:
    tags:
      - "v*"

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: --timeout=5m

  validate-tag:
    name: Validate Tag
    runs-on: ubuntu-latest
    steps:
      - name: Validate semantic tag
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid tag '$TAG'. Expected vMAJOR.MINOR.PATCH"
            exit 1
          fi

  build:
    name: Build (${{ matrix.goos }})
    runs-on: ubuntu-latest
    needs: [ "validate-tag", "lint" ]
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
            archive: tar.gz
          - goos: windows
            goarch: amd64
            ext: .exe
            archive: zip
          - goos: darwin
            goarch: amd64
            ext: ""
            archive: tar.gz
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          cache: true

      - name: Quality gate
        run: make tidy vet test

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          CURRENT_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          go build -ldflags "-X noto/internal/version.Version=${{ github.ref_name }} -X noto/internal/version.Commit=${{ github.sha}} -X noto/internal/version.Date=$CURRENT_DATE" -o dist/noto${{ matrix.ext }} ./cmd/noto

      - name: Package artifact
        run: |
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            zip noto-${{ matrix.goos }}-${{ matrix.goarch }}.zip noto-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          else
            tar -czf noto-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz noto-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }}
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: noto-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            dist/*.zip
            dist/*.tar.gz

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect assets
        run: |
          mkdir -p release-assets
          find dist -type f \( -name '*.zip' -o -name '*.tar.gz' \) -exec cp {} release-assets/ \;

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
